<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ROC 4SIX HR Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="bg-slate-50 text-slate-900">
  <div class="min-h-screen lg:flex">
    <aside class="sidebar text-white lg:w-64 lg:min-h-screen">
      <div class="brand-header px-6 py-6">
        <div class="brand-name text-xs tracking-[.28em] font-bold">ROC 4SIX</div>
        <div class="text-xl font-semibold mt-1">HR Platform</div>
        <div class="brand-subtitle text-xs mt-1">People. Progress. Partnership.</div>
      </div>
      <nav class="flex lg:block gap-1 overflow-x-auto p-3" aria-label="Main navigation">
        <button class="nav-link" data-page="dashboard">Dashboard</button>
        <button class="nav-link" data-page="organizations">Organizations</button>
        <button class="nav-link" data-page="employees">Employees</button>
        <button class="nav-link" data-page="recruitment">Recruitment</button>
      </nav>
      <div class="hidden lg:block px-6 mt-12 text-xs text-slate-500">ROC 4SIX HR Services<br>Workspace · Version 1</div>
    </aside>
    <main class="flex-1 min-w-0">
      <header class="bg-white border-b border-slate-200 px-5 md:px-10 py-5 flex justify-between items-center gap-4">
        <div><p class="text-xs font-semibold tracking-widest uppercase text-slate-400">HR Services / Workspace</p><h1 id="page-title" class="text-2xl font-bold mt-1">Dashboard</h1></div>
        <div class="hidden sm:flex items-center gap-2 text-sm text-slate-500"><span class="w-2 h-2 rounded-full bg-emerald-500"></span> ROC 4SIX HR</div>
      </header>
      <div id="notice" role="status" class="hidden mx-5 md:mx-10 mt-5 rounded-xl px-4 py-3 text-sm"></div>
      <div id="content" class="p-5 md:p-10 max-w-7xl mx-auto"></div>
    </main>
  </div>
  <div id="modal" class="hidden fixed inset-0 z-50 bg-slate-950/60 p-4 overflow-y-auto" role="dialog" aria-modal="true">
    <div class="bg-white rounded-2xl shadow-2xl max-w-2xl mx-auto my-8 p-6 md:p-8">
      <div class="flex justify-between items-start gap-4 mb-6"><h2 id="modal-title" class="text-xl font-bold"></h2><button id="close-modal" class="text-slate-500 text-2xl leading-none" aria-label="Close">&times;</button></div>
      <div id="modal-body"></div>
    </div>
  </div>
  <script src="/js/app.js" defer></script>
</body>
</html>
